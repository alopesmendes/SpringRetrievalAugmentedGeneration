# =============================================================================
# Deploy Workflow - Render Deployment
# =============================================================================
# Deploys the application to Render (Free Plan: 2 services only)
# This workflow can ONLY be called from CI.yml - no manual trigger.
#
# Render Service Mapping:
#   - development, test → image-rag-dev
#   - staging, prod     → image-rag-prod
#
# Note: We don't wait for Render deployment to complete (wait_deploy: false)
# because free tier cold starts can take 2-3 minutes. The verify job handles
# health checking with proper retries.
#
# =============================================================================

name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: string
      clear_cache:
        description: 'Clear build cache before deploying'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  deployments: write

jobs:
  # ===========================================================================
  # Resolve Render Service
  # ===========================================================================
  resolve:
    name: 🔍 Resolve Render Service
    runs-on: ubuntu-latest

    outputs:
      environment: ${{ inputs.environment }}
      render_service: ${{ steps.resolve.outputs.render_service }}

    steps:
      - name: 🔍 Map environment to Render service
        id: resolve
        run: |
          SELECTED_ENV="${{ inputs.environment }}"

          # Map environment to Render service (2 services only)
          case "$SELECTED_ENV" in
            development|test)
              RENDER_SERVICE="dev"
              ;;
            staging|prod)
              RENDER_SERVICE="prod"
              ;;
            *)
              RENDER_SERVICE="dev"
              ;;
          esac

          echo "render_service=$RENDER_SERVICE" >> $GITHUB_OUTPUT
          echo "✅ Environment: $SELECTED_ENV"
          echo "✅ Render service: image-rag-$RENDER_SERVICE"

  # ===========================================================================
  # Deploy to Render
  # ===========================================================================
  deploy:
    name: 🚀 Deploy to Render (${{ needs.resolve.outputs.render_service }})
    runs-on: ubuntu-latest
    needs: [resolve]
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.RENDER_DOMAIN }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🔧 Resolve Render Service ID
        id: resolve_service
        run: |
          SERVICE_ID="${{ vars.RENDER_SERVICE_ID }}"

          if [[ -z "$SERVICE_ID" ]]; then
            echo "❌ RENDER_SERVICE_ID is not set for environment '${{ inputs.environment }}'"
            echo ""
            echo "📋 Setup required:"
            echo "1. Go to Repository → Settings → Environments → ${{ inputs.environment }}"
            echo "2. Add variable: RENDER_SERVICE_ID = srv-xxx"
            echo "3. Get the service ID from Render Dashboard URL"
            exit 1
          fi

          echo "service_id=$SERVICE_ID" >> $GITHUB_OUTPUT
          echo "✅ Using Service ID: ${SERVICE_ID:0:10}..."

      - name: 🔧 Validate Render configuration
        run: |
          if [[ -z "${{ secrets.RENDER_API_KEY }}" ]]; then
            echo "❌ RENDER_API_KEY is not set in repository secrets"
            echo ""
            echo "📋 Setup required:"
            echo "1. Go to https://dashboard.render.com/u/settings#api-keys"
            echo "2. Generate an API key"
            echo "3. Add to Repository → Settings → Secrets → RENDER_API_KEY"
            exit 1
          fi
          echo "✅ Render configuration validated"

      - name: 🚀 Trigger Render Deployment
        id: deploy
        uses: JorgeLNJunior/render-deploy@32c271db15b8b87b91cec4bb2cc094cc7c0f98a2 # v1.5.0
        with:
          service_id: ${{ steps.resolve_service.outputs.service_id }}
          api_key: ${{ secrets.RENDER_API_KEY }}
          clear_cache: ${{ inputs.clear_cache }}
          # Don't wait for deployment - free tier can take 2-3 minutes
          # The verify job will handle health checking with retries
          wait_deploy: false
          github_deployment: true
          deployment_environment: ${{ inputs.environment }}
          github_token: ${{ secrets.PROJECT_TOKEN }}

      - name: 📝 Deployment triggered summary
        run: |
          echo "## 🚀 Deployment Triggered" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub Environment | \`${{ inputs.environment }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Render Service | \`image-rag-${{ needs.resolve.outputs.render_service }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${GITHUB_REF_NAME}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${GITHUB_SHA::7}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployed by | @${GITHUB_ACTOR} |" >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "| Cache cleared | \`${{ inputs.clear_cache }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⏳ Waiting for deployment to complete... (see Verify job)" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Post-Deployment Verification
  # ===========================================================================
  verify:
    name: ✅ Verify Deployment
    runs-on: ubuntu-latest
    needs: [resolve, deploy]
    environment: ${{ inputs.environment }}

    steps:
      - name: ⏳ Wait for Render to start building
        run: |
          echo "Waiting 30 seconds for Render to start the build..."
          sleep 30

      - name: 🏥 Health check with extended retries
        id: health_check
        run: |
          DOMAIN="${{ vars.RENDER_DOMAIN }}"

          if [[ -z "$DOMAIN" ]]; then
            echo "⚠️ RENDER_DOMAIN is not set - skipping health check"
            echo "status=skipped" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Remove trailing slash if present
          DOMAIN="${DOMAIN%/}"

          # Ensure we have https:// prefix
          if [[ ! "$DOMAIN" =~ ^https?:// ]]; then
            DOMAIN="https://${DOMAIN}"
          fi

          # External health endpoint (simple /health endpoint returns 200 OK)
          HEALTH_ENDPOINT="${DOMAIN}/actuator/health"

          echo "🔍 Checking health at: ${HEALTH_ENDPOINT}"
          echo ""
          echo "Note: Render free tier cold starts can take 2-3 minutes."
          echo "Will retry for up to 5 minutes..."
          echo ""

          # Try for 5 minutes (20 attempts * 15 seconds)
          MAX_ATTEMPTS=20
          WAIT_SECONDS=15

          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo "⏳ Attempt $i/$MAX_ATTEMPTS..."

            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${HEALTH_ENDPOINT}" 2>/dev/null || echo "000")

            if [[ "$HTTP_STATUS" == "200" ]]; then
              echo ""
              echo "✅ Health check passed (HTTP $HTTP_STATUS)"
              echo "status=success" >> $GITHUB_OUTPUT
              exit 0
            elif [[ "$HTTP_STATUS" == "000" ]]; then
              echo "   Connection failed - service may be starting..."
            else
              echo "   HTTP $HTTP_STATUS - not ready yet..."
            fi

            if [[ $i -lt $MAX_ATTEMPTS ]]; then
              echo "   Retrying in ${WAIT_SECONDS} seconds..."
              sleep $WAIT_SECONDS
            fi
          done

          echo ""
          echo "❌ Health check failed after $MAX_ATTEMPTS attempts (5 minutes)"
          echo "status=failed" >> $GITHUB_OUTPUT
          exit 1

      - name: 📝 Verification summary
        if: always()
        run: |
          echo "## ✅ Deployment Verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ steps.health_check.outputs.status }}" == "success" ]]; then
            echo "✅ **Application is healthy!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🌐 URL: [${{ vars.RENDER_DOMAIN }}](${{ vars.RENDER_DOMAIN }})" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ steps.health_check.outputs.status }}" == "skipped" ]]; then
            echo "⚠️ **Health check skipped** - RENDER_DOMAIN not configured" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Health check failed**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The application did not become healthy within 5 minutes." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Troubleshooting" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "1. Check [Render Dashboard](https://dashboard.render.com) for build/deploy logs" >> $GITHUB_STEP_SUMMARY
            echo "2. Verify the application starts correctly locally" >> $GITHUB_STEP_SUMMARY
            echo "3. Check if the health endpoint \`/health\` is returning 200 OK" >> $GITHUB_STEP_SUMMARY
          fi

  # ===========================================================================
  # Notify on Failure
  # ===========================================================================
  notify-failure:
    name: 🚨 Notify Failure
    runs-on: ubuntu-latest
    needs: [resolve, deploy, verify]
    if: failure()

    steps:
      - name: 🚨 Create failure summary
        run: |
          echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub Environment | \`${{ inputs.environment }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Render Service | \`image-rag-${{ needs.resolve.outputs.render_service }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${GITHUB_REF_NAME}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Troubleshooting" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Check [Render Dashboard](https://dashboard.render.com) for build logs" >> $GITHUB_STEP_SUMMARY
          echo "2. Verify \`RENDER_API_KEY\` is valid in repository secrets" >> $GITHUB_STEP_SUMMARY
          echo "3. Verify \`RENDER_SERVICE_ID\` is set in the \`${{ inputs.environment }}\` environment" >> $GITHUB_STEP_SUMMARY
          echo "4. Check if the \`/health\` endpoint is returning 200 OK" >> $GITHUB_STEP_SUMMARY
