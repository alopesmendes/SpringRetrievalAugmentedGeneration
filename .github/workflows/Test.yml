# =============================================================================
# Test Workflow - Unit, Integration & E2E Tests
# =============================================================================
# Runs tests using consolidated Gradle tasks
# This workflow can ONLY be called from CI.yml - no manual trigger.
# =============================================================================

name: Test

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment for secrets/variables'
        required: false
        type: string
        default: 'development'

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  # ===========================================================================
  # Unit Tests - All modules in single Gradle invocation
  # ===========================================================================
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: ☕ Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@f29f5a9d7b09a7c6b29859002d29d24e1674c884 # v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: 🧪 Run unit tests for all modules
        run: ./gradlew unitTest --continue

      - name: 📦 Assemble test results
        if: always()
        run: ./gradlew assembleTestResults || true

      - name: 📊 Upload test reports
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        if: always()
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/test/'
          retention-days: 14

      - name: 📝 Upload test results
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        if: always()
        with:
          name: unit-test-results
          path: build/test-results/
          retention-days: 14

  # ===========================================================================
  # Integration Tests - Infrastructure module with MongoDB
  # ===========================================================================
  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: ☕ Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@f29f5a9d7b09a7c6b29859002d29d24e1674c884 # v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: 🐳 Set up Docker
        uses: docker/setup-docker-action@e43656e248c0bd0647d3f5c195d116aacf6fcaf4 # v4

      - name: 🔗 Run integration tests
        run: ./gradlew integrationTest --continue
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/imagerag-test

      - name: 📦 Assemble test results
        if: always()
        run: ./gradlew assembleTestResults || true

      - name: 📊 Upload test reports
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        if: always()
        with:
          name: integration-test-reports
          path: infrastructure/build/reports/tests/integrationTest/
          retention-days: 14

      - name: 📝 Upload test results
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        if: always()
        with:
          name: integration-test-results
          path: build/test-results/
          retention-days: 14

  # ===========================================================================
  # E2E Tests - Full application workflows with Cucumber
  # ===========================================================================
  e2e-tests:
    name: 🌐 E2E Tests
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: ☕ Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@f29f5a9d7b09a7c6b29859002d29d24e1674c884 # v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: 🌐 Run E2E tests (Cucumber)
        run: ./gradlew e2eTest --continue


      - name: 📦 Assemble test results
        if: always()
        run: ./gradlew assembleTestResults || true

      - name: 📊 Upload test reports
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        if: always()
        with:
          name: e2e-test-reports
          path: |
            infrastructure/build/reports/tests/e2eTest/
            infrastructure/build/reports/cucumber/
          retention-days: 14

      - name: 📝 Upload test results
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        if: always()
        with:
          name: e2e-test-results
          path: build/test-results/
          retention-days: 14

  # ===========================================================================
  # Test Summary - Publish all results
  # ===========================================================================
  test-summary:
    name: 📋 Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests]
    if: always()

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: 📥 Download all test results
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8
        with:
          pattern: '*-test-results'
          path: test-results
          merge-multiple: true

      - name: 📝 Publish test results
        uses: dorny/test-reporter@b082adf0eced0765477756c2a610396589b8c637 # v2
        with:
          name: Test Results
          path: 'test-results/**/*.xml'
          reporter: java-junit
          fail-on-error: false

      - name: 📝 Generate workflow summary
        run: |
          echo "## 🧪 Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${GITHUB_REF_NAME}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Jobs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests | ${{ needs.e2e-tests.result }} |" >> $GITHUB_STEP_SUMMARY
