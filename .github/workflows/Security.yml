# =============================================================================
# Security Workflow - Vulnerability Scanning & Analysis
# =============================================================================
# Performs security analysis on dependencies using Trivy via Gradle tasks.
# Scans all modules and the global project in a single job.
# Fails the build if CRITICAL or HIGH vulnerabilities are found.
#
# Triggers:
#   - Nightly schedule (2:30 AM UTC)
#
# NO manual trigger - for on-demand scans, use CI.yml.
# =============================================================================

name: Security

on:
  schedule:
    - cron: '30 2 * * *' # Run nightly at 2:30 AM

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  security:
    name: 🛡️ Security Scan
    runs-on: ubuntu-latest

    outputs:
      scan-passed: ${{ steps.verify.outputs.passed }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: ☕ Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: 🛡️ Install Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: 📝 Generate security reports for all modules
        run: ./gradlew securityReport

      - name: ✅ Verify no critical vulnerabilities
        id: verify
        run: |
          if ./gradlew verifySecurity; then
            echo "passed=true" >> $GITHUB_OUTPUT
          else
            echo "passed=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: 📋 Print security summary
        if: always()
        run: ./gradlew printSecuritySummary || true

      - name: 🔎 Validate SARIF file
        id: validate-sarif
        if: always()
        run: |
          SARIF_FILE="build/security-reports/global-security.sarif"
          if [ -f "$SARIF_FILE" ] && [ -s "$SARIF_FILE" ]; then
            echo "sarif_exists=true" >> $GITHUB_OUTPUT
            echo "✅ SARIF file exists and is not empty"
            if jq empty "$SARIF_FILE" 2>/dev/null; then
              echo "sarif_valid=true" >> $GITHUB_OUTPUT
              echo "✅ SARIF file is valid JSON"
            else
              echo "sarif_valid=false" >> $GITHUB_OUTPUT
              echo "❌ SARIF file is not valid JSON"
            fi
          else
            echo "sarif_exists=false" >> $GITHUB_OUTPUT
            echo "sarif_valid=false" >> $GITHUB_OUTPUT
            echo "⚠️ SARIF file does not exist or is empty"
          fi

      - name: 📤 Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4
        if: always() && steps.validate-sarif.outputs.sarif_valid == 'true'
        with:
          sarif_file: build/security-reports/global-security.sarif
          category: trivy-security
          wait-for-processing: true

      - name: 📦 Upload security reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: security-reports
          path: build/security-reports/
          retention-days: 30
          if-no-files-found: warn

      - name: 📝 Generate workflow summary
        if: always()
        run: |
          echo "## 🛡️ Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.verify.outputs.passed }}" == "true" ]; then
            echo "✅ **No CRITICAL or HIGH vulnerabilities found**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **CRITICAL or HIGH vulnerabilities detected**" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Scanned Modules" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Module | Report |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Domain | ✅ Generated |" >> $GITHUB_STEP_SUMMARY
          echo "| Application | ✅ Generated |" >> $GITHUB_STEP_SUMMARY
          echo "| Infrastructure | ✅ Generated |" >> $GITHUB_STEP_SUMMARY
          echo "| **Global** | ✅ Generated |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 View detailed results in the [Security tab](../../security/code-scanning)" >> $GITHUB_STEP_SUMMARY
